[package]
name = "changli-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
rfd = "0.15"
serde_json = "1"
tao = "0.30"
wry = "0.47"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.33"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[build-dependencies]
winresource = "0.1"
