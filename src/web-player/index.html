<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChangLi - Web Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --card: #1a1a26;
  --card-hover: #222233;
  --border: rgba(255,255,255,0.06);
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --accent-glow: rgba(108,92,231,0.3);
  --text: #e8e8f0;
  --text-secondary: #8888a0;
  --text-muted: #555566;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== NAV BAR ===== */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 56px;
  background: rgba(10,10,15,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
}
.nav-back {
  cursor: pointer;
  background: none; border: none; color: var(--accent-light);
  font-size: 20px; padding: 6px 8px; border-radius: 8px;
  transition: background var(--transition);
}
.nav-back:hover { background: rgba(108,92,231,0.1); }
.nav-logo {
  font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  flex-shrink: 0;
}
.nav-center {
  flex: 1; display: flex; justify-content: center;
  overflow-x: auto; scrollbar-width: none;
  gap: 4px; padding: 0 12px;
}
.nav-center::-webkit-scrollbar { display: none; }
.nav-tab {
  flex-shrink: 0; padding: 6px 16px; border-radius: 20px;
  background: transparent; border: 1px solid transparent;
  color: var(--text-secondary); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--transition); white-space: nowrap;
}
.nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-tab.active {
  color: #fff; background: var(--accent);
  border-color: var(--accent); font-weight: 600;
  box-shadow: 0 2px 12px var(--accent-glow);
}
.nav-search {
  position: relative; flex-shrink: 0;
}
.nav-search input {
  width: 180px; padding: 7px 32px 7px 12px;
  border-radius: 20px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--text);
  font-size: 13px; outline: none; transition: all var(--transition);
}
.nav-search input::placeholder { color: var(--text-muted); }
.nav-search input:focus { border-color: var(--accent); width: 220px; background: rgba(255,255,255,0.06); }
.nav-search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-muted);
  font-size: 14px; cursor: pointer; display: none; line-height: 1;
}
.nav-search-clear.visible { display: block; }

/* ===== CONTENT AREA ===== */
.content { padding: 72px 20px 40px; max-width: 1400px; margin: 0 auto; }

/* ===== ACTOR ROW ===== */
.actors-section { margin-bottom: 24px; }
.actors-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
}
.actors-row {
  display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px;
  scrollbar-width: none;
}
.actors-row::-webkit-scrollbar { display: none; }
.actor-chip {
  flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; gap: 6px; cursor: pointer; width: 72px;
  transition: transform var(--transition);
}
.actor-chip:hover { transform: translateY(-2px); }
.actor-chip:hover .actor-avatar { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
.actor-avatar {
  width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--border); background: var(--card);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.actor-name {
  font-size: 11px; color: var(--text-secondary); text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72px;
}
.back-btn-row { margin-bottom: 16px; display: none; }
.back-btn-row button {
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  color: var(--accent-light); padding: 8px 20px; border-radius: 20px;
  font-size: 13px; cursor: pointer; transition: all var(--transition);
}
.back-btn-row button:hover { background: rgba(108,92,231,0.12); border-color: rgba(108,92,231,0.3); }

/* ===== SERIES GRID ===== */
.series-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 20px;
}
.series-card {
  background: var(--card); border-radius: var(--radius-lg);
  overflow: hidden; cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  border: 1px solid var(--border);
}
.series-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,92,231,0.2);
}
.series-card .poster {
  width: 100%; aspect-ratio: 2/3; object-fit: cover;
  background: var(--surface); display: block;
}
.series-card .info { padding: 12px 14px; }
.series-card .title {
  font-size: 13px; font-weight: 600; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.series-card .meta {
  font-size: 11px; color: var(--text-muted); margin-top: 4px;
}

/* ===== DETAIL PAGE ===== */
.detail { max-width: 960px; margin: 0 auto; }
.detail-header { display: flex; gap: 24px; margin-bottom: 32px; align-items: flex-start; }
.detail-poster {
  width: 200px; min-width: 200px; border-radius: var(--radius-lg);
  aspect-ratio: 2/3; object-fit: cover; background: var(--card);
  box-shadow: var(--shadow);
}
.detail-info { flex: 1; }
.detail-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.detail-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.detail-badge {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  background: rgba(108,92,231,0.15); color: var(--accent-light);
}
.video-list { display: flex; flex-direction: column; gap: 8px; }
.video-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; background: var(--card);
  border-radius: var(--radius); cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
  border: 1px solid transparent;
}
.video-item:hover { background: var(--card-hover); border-color: var(--border); }
.video-item .ep-num {
  font-size: 13px; font-weight: 700; color: var(--accent-light);
  min-width: 44px; text-align: center;
}
.video-item .ep-name {
  flex: 1; font-size: 13px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.video-item .ep-res { font-size: 11px; color: var(--text-muted); }

/* ===== PLAYER ===== */
.player {
  position: fixed; inset: 0; background: #000; z-index: 200;
  display: flex; flex-direction: column;
}
.player video { flex: 1; width: 100%; background: #000; object-fit: contain; }
.player-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 210;
  padding: 16px 20px; display: flex; align-items: center; gap: 12px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  transition: opacity 0.3s;
}
.player-top .back { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 8px; }
.player-top .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 210;
  padding: 12px 20px 20px;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  transition: opacity 0.3s;
}
.progress {
  width: 100%; height: 4px; background: rgba(255,255,255,0.15);
  border-radius: 2px; cursor: pointer; margin-bottom: 12px; position: relative;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  width: 0%; pointer-events: none; transition: width 0.1s;
}
.progress-handle {
  position: absolute; top: 50%; transform: translate(-50%, -50%);
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent-light); pointer-events: none;
  box-shadow: 0 0 8px var(--accent-glow); display: none;
}
.progress:hover .progress-handle { display: block; }
.ctrl-row { display: flex; align-items: center; gap: 8px; }
.ctrl {
  background: none; border: none; color: rgba(255,255,255,0.85);
  font-size: 18px; cursor: pointer; padding: 6px 8px;
  display: flex; align-items: center; justify-content: center;
  min-width: 36px; min-height: 36px; border-radius: 8px;
  transition: background var(--transition), color var(--transition);
}
.ctrl:hover { background: rgba(255,255,255,0.1); color: #fff; }
.ctrl.active { color: var(--accent-light); }
.time {
  font-size: 12px; color: rgba(255,255,255,0.7);
  font-variant-numeric: tabular-nums; min-width: 90px; text-align: center;
}
.spacer { flex: 1; }
.vol-group { display: flex; align-items: center; gap: 6px; }
.vol-slider {
  width: 80px; height: 4px; -webkit-appearance: none; appearance: none;
  background: rgba(255,255,255,0.2); border-radius: 2px; outline: none;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; cursor: pointer;
}
.speed-menu {
  position: absolute; bottom: 64px; right: 20px;
  background: rgba(18,18,26,0.95); border-radius: var(--radius);
  padding: 6px 0; display: none; min-width: 80px;
  backdrop-filter: blur(20px); border: 1px solid var(--border);
}
.speed-menu.show { display: block; }
.speed-menu button {
  display: block; width: 100%; padding: 8px 16px;
  background: none; border: none; color: rgba(255,255,255,0.8);
  font-size: 13px; text-align: left; cursor: pointer;
  transition: background var(--transition);
}
.speed-menu button:hover { background: rgba(108,92,231,0.15); }
.speed-menu button.active { color: var(--accent-light); font-weight: 700; }

/* ===== STATES ===== */
.loading, .empty {
  text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 15px;
}
.loading::before {
  content: ''; display: block; width: 36px; height: 36px;
  margin: 0 auto 16px; border: 3px solid rgba(108,92,231,0.15);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .nav { padding: 0 12px; gap: 8px; }
  .nav-search input { width: 120px; }
  .nav-search input:focus { width: 160px; }
  .content { padding: 72px 12px 24px; }
  .series-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .detail-header { flex-direction: column; align-items: center; text-align: center; }
  .detail-poster { width: 160px; min-width: 160px; }
  .vol-slider { width: 60px; }
}
</style>
</head>
<body>

<!-- Nav Bar -->
<nav class="nav" id="nav">
  <button class="nav-back" id="navBack" onclick="goBack()">‹</button>
  <span class="nav-logo" onclick="goHome()" style="cursor:pointer">ChangLi</span>
  <div class="nav-center" id="navTabs"></div>
  <div class="nav-search">
    <input type="text" id="searchInput" placeholder="搜索..." oninput="onSearch(this.value)">
    <button class="nav-search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>
</nav>

<!-- Main Content -->
<div class="content" id="mainContent">
  <div class="back-btn-row" id="backRow">
    <button onclick="exitActor()">← 返回全部</button>
  </div>
  <div class="actors-section" id="actorsSection">
    <div class="actors-label">演员</div>
    <div class="actors-row" id="actorsRow"></div>
  </div>
  <div id="grid" class="loading">加载中...</div>
</div>

<!-- Detail Page -->
<div class="content detail" id="detailPage" style="display:none">
  <div class="detail-header">
    <img class="detail-poster" id="dPoster" alt="">
    <div class="detail-info">
      <h1 class="detail-title" id="dTitle"></h1>
      <p class="detail-desc" id="dDesc"></p>
      <span class="detail-badge" id="dBadge"></span>
    </div>
  </div>
  <div class="video-list" id="vList"></div>
</div>

<!-- Player -->
<div class="player" id="playerPage" style="display:none">
  <video id="video" playsinline></video>
  <div class="player-top" id="pTop">
    <button class="back" onclick="closePlayer()">←</button>
    <span class="title" id="pTitle"></span>
  </div>
  <div class="player-bottom" id="pBottom">
    <div class="progress" id="progress" onclick="seek(event)">
      <div class="progress-fill" id="pFill"></div>
      <div class="progress-handle" id="pHandle"></div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl" onclick="prevEp()" title="上一集">⏮</button>
      <button class="ctrl" id="playBtn" onclick="togglePlay()" title="播放/暂停">▶</button>
      <button class="ctrl" onclick="nextEp()" title="下一集">⏭</button>
      <span class="time" id="timeDisp">00:00 / 00:00</span>
      <div class="spacer"></div>
      <div class="vol-group">
        <button class="ctrl" id="muteBtn" onclick="toggleMute()" title="静音">🔊</button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVol(this.value)">
      </div>
      <button class="ctrl" id="speedBtn" onclick="toggleSpeed()" title="倍速">1x</button>
      <div class="speed-menu" id="speedMenu">
        <button onclick="setSpeed(0.5)">0.5x</button>
        <button class="active" onclick="setSpeed(1)">1x</button>
        <button onclick="setSpeed(1.5)">1.5x</button>
        <button onclick="setSpeed(2)">2x</button>
      </div>
      <button class="ctrl" onclick="toggleFS()" title="全屏">⛶</button>
    </div>
  </div>
</div>

<script>
// === State ===
var currentId = null;
var currentIdx = -1;
var videos = [];
var hideTimer = null;
var allSeries = [];
var categories = [];
var curCat = 'all';
var searchQ = '';
var searchTmr = null;
var actorMode = false;

function $(id) { return document.getElementById(id); }

// === Default images via string concat (no template literals with data URLs) ===
var DEFAULT_POSTER = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300">' +
  '<rect width="200" height="300" fill="#1a1a26"/>' +
  '<text x="100" y="150" text-anchor="middle" fill="#555" font-size="14" font-family="sans-serif">No Poster</text></svg>'
);
var DEFAULT_AVATAR = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56">' +
  '<rect width="56" height="56" rx="28" fill="#1a1a26"/>' +
  '<text x="28" y="34" text-anchor="middle" fill="#555" font-size="20">👤</text></svg>'
);

// === Navigation ===
function showView(view) {
  $('mainContent').style.display = (view === 'list') ? '' : 'none';
  $('detailPage').style.display = (view === 'detail') ? '' : 'none';
  $('playerPage').style.display = (view === 'player') ? '' : 'none';
  $('navBack').style.display = (view !== 'list') ? '' : 'none';
  if (view === 'list') { currentId = null; }
}

function goHome() {
  currentId = null; searchQ = ''; curCat = 'all'; actorMode = false;
  $('searchInput').value = ''; $('searchClear').classList.remove('visible');
  showView('list'); renderGrid(allSeries); renderTabs();
  $('actorsSection').style.display = categories.length > 0 ? '' : 'none';
}
function goBack() {
  var v = $('video');
  if (v && !v.paused) { v.pause(); v.src = ''; }
  if (currentId) { currentId = null; showView('list'); renderGrid(allSeries); }
}

// === Categories ===
function renderTabs() {
  var el = $('navTabs');
  if (categories.length === 0) { el.innerHTML = ''; return; }
  var html = '<button class="nav-tab active" data-key="all" onclick="selectCat(\'all\')">全部</button>';
  for (var i = 0; i < categories.length; i++) {
    var c = categories[i];
    html += '<button class="nav-tab" data-key="' + esc(c.key) + '" onclick="selectCat(\'' + esc(c.key) + '\')">' + esc(c.name) + '</button>';
  }
  el.innerHTML = html;
}

function selectCat(key) {
  curCat = key;
  var tabs = $('navTabs').querySelectorAll('.nav-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-key') === key);
  }
  searchQ = ''; $('searchInput').value = ''; $('searchClear').classList.remove('visible');
  if (actorMode) exitActor();
  if (currentId) { currentId = null; showView('list'); }
  var filtered = key === 'all' ? allSeries : allSeries.filter(function(s) { return s.display_type === key; });
  renderGrid(filtered);
}

// === Search ===
function onSearch(val) {
  var q = val.trim();
  $('searchClear').classList.toggle('visible', q.length > 0);
  clearTimeout(searchTmr);
  if (!q) { searchQ = ''; renderGrid(allSeries); return; }
  searchTmr = setTimeout(function() { doSearch(q); }, 300);
}

async function doSearch(q) {
    searchQ = q;
    if (currentId) { currentId = null; showView('list'); }
    var el = $('grid'); el.className = 'loading'; el.textContent = '搜索中...';
    $('navTabs').style.display = 'none';
    $('actorsSection').style.display = 'none';
    try {
    var r = await fetch('/api/search?q=' + encodeURIComponent(q));
    var d = await r.json();
    renderGrid(d.series || []);
  } catch(e) {
    el.className = 'empty'; el.textContent = '搜索失败: ' + e.message;
  }
}

function clearSearch() {
  $('searchInput').value = ''; searchQ = '';
  $('searchClear').classList.remove('visible');
  if (currentId) { currentId = null; showView('list'); }
  renderGrid(allSeries); renderTabs();
  $('actorsSection').style.display = categories.length > 0 ? '' : 'none';
}

// === Actors ===
async function loadActors() {
  try {
    var r = await fetch('/api/actors');
    var d = await r.json();
    var list = d.actors || [];
    if (!list.length) { $('actorsSection').style.display = 'none'; return; }
    $('actorsSection').style.display = '';
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      html += '<div class="actor-chip" onclick="openActor(' + a.id + ')" title="' + esc(a.name) + '">' +
        '<img class="actor-avatar" src="' + (a.avatar ? esc(a.avatar) : DEFAULT_AVATAR) + '" alt="' + esc(a.name) + '" loading="lazy">' +
        '<span class="actor-name">' + esc(a.name) + '</span></div>';
    }
    $('actorsRow').innerHTML = html;
  } catch(e) { $('actorsSection').style.display = 'none'; }
}

async function openActor(id) {
  actorMode = true;
  $('actorsSection').style.display = 'none';
  $('backRow').style.display = '';
  searchQ = ''; $('searchInput').value = ''; $('searchClear').classList.remove('visible');
  var el = $('grid'); el.className = 'loading'; el.textContent = '加载中...';
  try {
    var r = await fetch('/api/actors/' + id + '/series');
    var d = await r.json();
    renderGrid(d.series || []);
  } catch(e) { el.className = 'empty'; el.textContent = '加载失败: ' + e.message; }
}

function exitActor() {
  actorMode = false;
  $('backRow').style.display = 'none';
  renderTabs();
  $('actorsSection').style.display = categories.length > 0 ? '' : 'none';
  renderGrid(allSeries);
}

// === Series Grid ===
function renderGrid(list) {
  var el = $('grid');
  if (!list || !list.length) {
    el.className = 'empty'; el.textContent = searchQ ? '未找到匹配的剧集' : '暂无视频';
    return;
  }
  el.className = '';
  var html = '<div class="series-grid">';
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    var cat = categories.find(function(c) { return c.key === s.display_type; });
    var isLandscape = cat && cat.card_layout === 'landscape';
    var cardClass = isLandscape ? 'series-card landscape' : 'series-card';
    html += '<div class="' + cardClass + '" onclick="openDetail(' + s.id + ')">' +
      '<img class="poster" src="/api/poster/' + s.id + '" alt="' + esc(s.title) + '" loading="lazy" onerror="this.src=\'' + DEFAULT_POSTER + '\'">' +
      '<div class="info">' +
      '<div class="title">' + esc(s.title) + '</div>' +
      '<div class="meta">' + s.video_count + ' 集</div>' +
      '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// === Load Data ===
async function loadAll() {
  var el = $('grid'); el.className = 'loading'; el.textContent = '加载中...';
  try {
    var sr = await fetch('/api/series');
    var sd = await sr.json();
    allSeries = sd.series || [];
    var cr = await fetch('/api/categories').catch(function() { return { ok: false }; });
    if (cr.ok) { var cd = await cr.json(); categories = cd.categories || []; }
    else { categories = []; }
    renderTabs();
    loadActors();
    if (!allSeries.length) { el.className = 'empty'; el.textContent = '暂无视频'; return; }
    renderGrid(allSeries);
  } catch(e) { el.className = 'empty'; el.textContent = '加载失败: ' + e.message; }
}

// === Detail ===
async function openDetail(id) {
  currentId = id; showView('detail');
  var el = $('vList'); el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    var r = await fetch('/api/series/' + id);
    var d = await r.json();
    var s = d.series;
    $('dPoster').src = '/api/poster/' + id;
    $('dTitle').textContent = s.title;
    $('dDesc').textContent = s.description || '';
    $('dBadge').textContent = s.video_count + ' 集';
    videos = d.videos || [];
    if (!videos.length) { el.innerHTML = '<div class="empty">暂无视频</div>'; return; }
    var html = '';
    for (var i = 0; i < videos.length; i++) {
      var v = videos[i];
      var ep = v.episode_number != null ? ('E' + v.episode_number) : ('#' + (i + 1));
      html += '<div class="video-item" onclick="playEp(' + i + ')">' +
        '<span class="ep-num">' + ep + '</span>' +
        '<span class="ep-name">' + esc(v.file_name) + '</span>' +
        '<span class="ep-res">' + (v.resolution || '') + '</span></div>';
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="empty">加载失败: ' + esc(e.message) + '</div>'; }
}

// === Player ===
function playEp(idx) {
  if (idx < 0 || idx >= videos.length) return;
  currentIdx = idx;
  var v = videos[idx];
  showView('player');
  $('pTitle').textContent = v.file_name;
  var vid = $('video'); vid.src = '/api/stream/' + v.id; vid.load();
  vid.play().catch(function(){});
  resetUI(); scheduleHide();
}

function resetUI() { $('playBtn').textContent = '▶'; $('pFill').style.width = '0%'; $('timeDisp').textContent = '00:00 / 00:00'; }
function togglePlay() { var v = $('video'); v.paused ? v.play() : v.pause(); }
function prevEp() { if (currentIdx > 0) playEp(currentIdx - 1); }
function nextEp() { if (currentIdx < videos.length - 1) playEp(currentIdx + 1); }
function closePlayer() {
  var v = $('video'); v.pause(); v.src = '';
  if (currentId) { showView('detail'); } else { showView('list'); renderGrid(allSeries); }
}

// === Video Events ===
var vid = $('video');
vid.addEventListener('play', function() { $('playBtn').textContent = '⏸'; });
vid.addEventListener('pause', function() { $('playBtn').textContent = '▶'; });
vid.addEventListener('timeupdate', function() {
  var c = vid.currentTime, d = vid.duration || 0;
  if (d > 0) { $('pFill').style.width = (c / d * 100) + '%'; $('timeDisp').textContent = fmt(c) + ' / ' + fmt(d); }
});
vid.addEventListener('ended', function() { nextEp(); });

function seek(e) {
  var rect = $('progress').getBoundingClientRect();
  var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (vid.duration) vid.currentTime = pct * vid.duration;
}

function toggleSpeed() { $('speedMenu').classList.toggle('show'); }
function setSpeed(s) {
  $('video').playbackRate = s; $('speedBtn').textContent = s + 'x';
  var btns = $('speedMenu').querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', parseFloat(btns[i].textContent) === s);
  $('speedMenu').classList.remove('show');
}
function setVol(v) { $('video').volume = parseFloat(v); $('video').muted = false; updateMute(); }
function toggleMute() { $('video').muted = !$('video').muted; updateMute(); }
function updateMute() { var v = $('video'); $('muteBtn').textContent = (v.muted || v.volume === 0) ? '🔇' : '🔊'; }
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('playerPage').requestFullscreen && $('playerPage').requestFullscreen();
}

function scheduleHide() {
  clearTimeout(hideTimer);
  $('pTop').style.opacity = '1'; $('pBottom').style.opacity = '1';
  hideTimer = setTimeout(function() {
    if ($('playerPage').style.display === 'none') return;
    $('pTop').style.opacity = '0'; $('pBottom').style.opacity = '0';
  }, 3000);
}
$('playerPage').addEventListener('mousemove', scheduleHide);
$('playerPage').addEventListener('click', function(e) {
  if (e.target.closest('.ctrl') || e.target.closest('.speed-menu') || e.target.closest('.vol-slider') || e.target.closest('.progress')) return;
  scheduleHide();
});

// === Keyboard ===
document.addEventListener('keydown', function(e) {
  if ($('playerPage').style.display === 'none') return;
  var v = $('video');
  switch(e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': v.currentTime = Math.max(0, v.currentTime - 5); break;
    case 'ArrowRight': v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); break;
    case 'ArrowUp': e.preventDefault(); v.volume = Math.min(1, v.volume + 0.1); $('volSlider').value = v.volume; break;
    case 'ArrowDown': e.preventDefault(); v.volume = Math.max(0, v.volume - 0.1); $('volSlider').value = v.volume; break;
    case 'f': case 'F': toggleFS(); break;
    case 'Escape': if (document.fullscreenElement) document.exitFullscreen(); else closePlayer(); break;
  }
});

// === Helpers ===
function fmt(s) {
  if (!isFinite(s)) return '00:00';
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  var mp = (m < 10 ? '0' : '') + m;
  var sp = (sec < 10 ? '0' : '') + sec;
  return h > 0 ? (h + ':' + mp + ':' + sp) : (mp + ':' + sp);
}
function esc(s) {
  var el = document.createElement('span');
  el.textContent = s || '';
  return el.innerHTML;
}

// === Init ===
showView('list');
loadAll();
</script>
</body>
</html>
